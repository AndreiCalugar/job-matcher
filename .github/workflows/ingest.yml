name: ingest

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the hour
  workflow_dispatch:
    inputs:
      score_cap:
        description: "Max strong-tier scoring calls this run"
        default: "25"

# One run at a time; a slow run must not overlap the next tick.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingest -- --score-cap ${{ github.event.inputs.score_cap || '25' }}
